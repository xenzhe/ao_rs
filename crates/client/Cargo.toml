[package]
name = "client"
version = "0.1.0"
edition = "2021"
description = "Game client: AO20 maps and graphics at modern resolutions."

[dependencies]
ao-formats.workspace = true
ao-rules.workspace = true
ao-protocol.workspace = true
client-core.workspace = true
macroquad = { workspace = true, features = ["audio"] }
lewton = "0.9"
serde.workspace = true
toml.workspace = true

# DPAPI for the remembered password (secret.rs); already in the lock file via tokio/mio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
