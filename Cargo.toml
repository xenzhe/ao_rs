[workspace]
resolver = "2"
members = [
    "crates/ao-formats",
    "crates/ao-rules",
    "crates/ao-protocol",
    "crates/server",
    "crates/client",
    "crates/ao-snap",
    "crates/client-core",
    "crates/ao-testkit",
]

# One place for dependency versions; crates use `dep.workspace = true`.
[workspace.dependencies]
ao-formats = { path = "crates/ao-formats" }
ao-rules = { path = "crates/ao-rules" }
ao-protocol = { path = "crates/ao-protocol" }
client-core = { path = "crates/client-core" }
ao-testkit = { path = "crates/ao-testkit" }
server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
macroquad = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
image = { version = "0.24", default-features = false, features = ["png"] }

# Audio decoding is too slow unoptimised (1.3 s hitch on every music change in dev builds;
# 176 ms with these). Our own crates stay in debug.
[profile.dev.package.hound]
opt-level = 3
[profile.dev.package.audrey]
opt-level = 3
[profile.dev.package.quad-snd]
opt-level = 3
[profile.dev.package.lewton]
opt-level = 3

# Optimised build for playing and testing (scripts/jugar.cmd): release speed in the game,
# much faster to compile than the full release (no LTO, parallel codegen).
[profile.play]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "unwind"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
