[workspace]
resolver = "2"
members = [
    "crates/ao-formats",
    "crates/ao-rules",
    "crates/ao-protocol",
    "crates/server",
    "crates/client",
]

# One place for dependency versions; crates use `dep.workspace = true`.
[workspace.dependencies]
ao-formats = { path = "crates/ao-formats" }
ao-rules = { path = "crates/ao-rules" }
ao-protocol = { path = "crates/ao-protocol" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
macroquad = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
