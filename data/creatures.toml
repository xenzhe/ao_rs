# Criaturas que el servidor reparte por los mapas que no son zona segura.
#
# body/head     cuerpo y cabeza oficiales de AO (Recursos/init/cuerpos.dat, cabezas.ini;
#               en Recursos/Dat/npcs.dat se ve cual usa cada NPC original)
# damage        dano cuerpo a cuerpo [minimo, maximo]
# attack_ms     tiempo entre golpes
# step_ms       tiempo entre pasos al perseguir
# aggro_range   casillas a las que ve a un jugador (con linea de vision)
# wander_range  cuanto se aleja de su punto de aparicion cuando pasea
# exp           experiencia que da al morir
# respawn_secs  segundos hasta reaparecer
# spawn_weight  probabilidad relativa de aparecer

[[creature]]
id = 1
